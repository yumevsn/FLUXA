[package]
name = "fluxa"
version = "1.0.0"
description = "Learn languages with interactive flashcards. Offline, no accounts."
authors = ["Tana Mungombe", "FLUXA contributors"]
license = "MIT"
repository = "https://github.com/yumevsn/FLUXA"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fluxa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

# Small, fast release binary. The Rust side is a thin shell around the web app.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
