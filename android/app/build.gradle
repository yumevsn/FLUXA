apply plugin: 'com.android.application'

// Version comes from package.json, e.g. 1.2.3 -> versionName 1.2.3, versionCode 10203
def fluxaVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
def fluxaVersionParts = fluxaVersion.tokenize('.').collect { it.replaceAll(/[^0-9].*/, '') as int }
def fluxaVersionCode = fluxaVersionParts[0] * 10000 + fluxaVersionParts[1] * 100 + fluxaVersionParts[2]

// Release signing. The key is never committed:
//  - locally: android/keystore.properties (git-ignored) with
//      storeFile, storePassword, keyAlias, keyPassword
//  - in CI: FLUXA_KEYSTORE_FILE, FLUXA_KEYSTORE_PASSWORD, FLUXA_KEY_ALIAS, FLUXA_KEY_PASSWORD
def signingProps = new Properties()
def signingPropsFile = rootProject.file('keystore.properties')
if (signingPropsFile.exists()) signingPropsFile.withInputStream { signingProps.load(it) }
def signingValue = { String prop, String env -> System.getenv(env) ?: signingProps.getProperty(prop) }
def releaseStoreFile = signingValue('storeFile', 'FLUXA_KEYSTORE_FILE')

android {
    namespace "io.fluxa.app"
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.fluxa.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode fluxaVersionCode
        versionName fluxaVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseStoreFile) {
            release {
                storeFile file(releaseStoreFile)
                storePassword signingValue('storePassword', 'FLUXA_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'FLUXA_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'FLUXA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // Without a key this builds an unsigned APK (app-release-unsigned.apk)
            if (releaseStoreFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
